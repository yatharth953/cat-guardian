<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cat Guardian settings</title>
<style>
  :root { color-scheme: dark; font: 15px system-ui, sans-serif; }
  body { max-width: 620px; margin: 40px auto; padding: 0 20px; background: #10191d; color: #e7f0ed; }
  h1 { font-size: 24px; } p { color: #b2c3bf; line-height: 1.5; }
  textarea { box-sizing: border-box; width: 100%; min-height: 180px; padding: 12px; border-radius: 10px; border: 1px solid #38514d; background: #152326; color: inherit; }
  button { margin-top: 14px; border: 0; border-radius: 9px; padding: 10px 16px; background: #8fd6a9; color: #102019; font-weight: 700; cursor: pointer; }
  #status { min-height: 1.5em; color: #8fd6a9; }
</style>
</head>
<body>
  <h1>Cat Guardian</h1>
  <p>One domain per line. Matching domains and their subdomains are blocked. These settings stay in this browser profile.</p>
  <textarea id="domains" spellcheck="false"></textarea>
  <br><button id="save">Save domains</button>
  <p id="status" role="status"></p>
  <script src="options.js"></script>
</body>
</html>
